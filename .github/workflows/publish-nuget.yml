name: Publish NuGet

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref to publish from, for example v1.0.0'
        required: true
        type: string
      version:
        description: 'Package version to publish, for example 1.0.0'
        required: true
        type: string
      package:
        description: 'Package to publish'
        required: true
        type: choice
        default: RsqlParserNet
        options:
          - RsqlParserNet
          - RsqlParserNet.Linq
          - RsqlParserNet.AspNetCore
          - RsqlParserNet.EntityFrameworkCore
          - RsqlParserNet.FastEndpoints
          - RsqlParserNet.OpenApi
          - RsqlParserNet.Swashbuckle
          - RsqlParserNet.NSwag

permissions:
  contents: read

jobs:
  publish:
    name: Publish NuGet Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RsqlParserNet.sln

      - name: Build
        run: dotnet build RsqlParserNet.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RsqlParserNet.sln --configuration Release --no-build --verbosity normal

      - name: Resolve Package
        id: package
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in
            RsqlParserNet)
              echo "project=src/RsqlParserNet/RsqlParserNet.csproj" >> "$GITHUB_OUTPUT"
              echo "id=RsqlParserNet" >> "$GITHUB_OUTPUT"
              ;;
            RsqlParserNet.Linq)
              echo "project=src/RsqlParserNet.Linq/RsqlParserNet.Linq.csproj" >> "$GITHUB_OUTPUT"
              echo "id=RsqlParserNet.Linq" >> "$GITHUB_OUTPUT"
              ;;
            RsqlParserNet.AspNetCore)
              echo "project=src/RsqlParserNet.AspNetCore/RsqlParserNet.AspNetCore.csproj" >> "$GITHUB_OUTPUT"
              echo "id=RsqlParserNet.AspNetCore" >> "$GITHUB_OUTPUT"
              ;;
            RsqlParserNet.EntityFrameworkCore)
              echo "project=src/RsqlParserNet.EntityFrameworkCore/RsqlParserNet.EntityFrameworkCore.csproj" >> "$GITHUB_OUTPUT"
              echo "id=RsqlParserNet.EntityFrameworkCore" >> "$GITHUB_OUTPUT"
              ;;
            RsqlParserNet.FastEndpoints)
              echo "project=src/RsqlParserNet.FastEndpoints/RsqlParserNet.FastEndpoints.csproj" >> "$GITHUB_OUTPUT"
              echo "id=RsqlParserNet.FastEndpoints" >> "$GITHUB_OUTPUT"
              ;;
            RsqlParserNet.OpenApi)
              echo "project=src/RsqlParserNet.OpenApi/RsqlParserNet.OpenApi.csproj" >> "$GITHUB_OUTPUT"
              echo "id=RsqlParserNet.OpenApi" >> "$GITHUB_OUTPUT"
              ;;
            RsqlParserNet.Swashbuckle)
              echo "project=src/RsqlParserNet.Swashbuckle/RsqlParserNet.Swashbuckle.csproj" >> "$GITHUB_OUTPUT"
              echo "id=RsqlParserNet.Swashbuckle" >> "$GITHUB_OUTPUT"
              ;;
            RsqlParserNet.NSwag)
              echo "project=src/RsqlParserNet.NSwag/RsqlParserNet.NSwag.csproj" >> "$GITHUB_OUTPUT"
              echo "id=RsqlParserNet.NSwag" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported package '$PACKAGE'" >&2
              exit 1
              ;;
          esac

      - name: Pack Requested Version
        run: >
          dotnet pack ${{ steps.package.outputs.project }}
          --configuration Release
          --no-build
          --output artifacts/packages
          -p:PackageVersion=${{ inputs.version }}
          -p:Version=${{ inputs.version }}
          -p:InformationalVersion=${{ inputs.version }}

      - name: Publish Package
        run: >
          dotnet nuget push artifacts/packages/${{ steps.package.outputs.id }}.${{ inputs.version }}.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Publish Symbols
        run: >
          dotnet nuget push artifacts/packages/${{ steps.package.outputs.id }}.${{ inputs.version }}.snupkg
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate

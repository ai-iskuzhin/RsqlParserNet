name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-test-pack:
    name: Build, Test, Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RsqlParserNet.sln

      - name: Build
        run: dotnet build RsqlParserNet.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RsqlParserNet.sln --configuration Release --no-build --verbosity normal

      - name: Pack Core
        run: dotnet pack src/RsqlParserNet/RsqlParserNet.csproj --configuration Release --no-build --output artifacts/packages

      - name: Pack LINQ Adapter
        run: dotnet pack src/RsqlParserNet.Linq/RsqlParserNet.Linq.csproj --configuration Release --no-build --output artifacts/packages

      - name: Pack ASP.NET Core Adapter
        run: dotnet pack src/RsqlParserNet.AspNetCore/RsqlParserNet.AspNetCore.csproj --configuration Release --no-build --output artifacts/packages

      - name: Pack EF Core Adapter
        run: dotnet pack src/RsqlParserNet.EntityFrameworkCore/RsqlParserNet.EntityFrameworkCore.csproj --configuration Release --no-build --output artifacts/packages

      - name: Pack FastEndpoints Adapter
        run: dotnet pack src/RsqlParserNet.FastEndpoints/RsqlParserNet.FastEndpoints.csproj --configuration Release --no-build --output artifacts/packages

      - name: Pack OpenAPI Adapter
        run: dotnet pack src/RsqlParserNet.OpenApi/RsqlParserNet.OpenApi.csproj --configuration Release --no-build --output artifacts/packages

      - name: Pack Swashbuckle Adapter
        run: dotnet pack src/RsqlParserNet.Swashbuckle/RsqlParserNet.Swashbuckle.csproj --configuration Release --no-build --output artifacts/packages

      - name: Pack NSwag Adapter
        run: dotnet pack src/RsqlParserNet.NSwag/RsqlParserNet.NSwag.csproj --configuration Release --no-build --output artifacts/packages

      - name: Upload Packages
        uses: actions/upload-artifact@v5
        with:
          name: packages
          path: artifacts/packages/*
